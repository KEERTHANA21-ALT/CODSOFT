<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐼🦄Makku Bekku</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(to right, #c471f5, #fa71cd);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .popup {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0px 5px 15px rgba(0,0,0,0.2);
      text-align: center;
      z-index: 2;
      margin-bottom: 20px;
    }

    h2 {
      margin-bottom: 15px;
      color: #333;
    }

    button {
      margin: 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: 0.3s;
    }

    .tea {
      background: #6ab04c;
      color: white;
    }

    .tea:hover {
      background: #58b368;
    }

    .coffee {
      background: #e67e22;
      color: white;
    }

    .coffee:hover {
      background: #d35400;
    }

    /* Unicorn stays */
    .unicorn {
      font-size: 100px;
      display: none;
      text-align: center;
      animation: popUp 0.6s ease;
    }

    @keyframes popUp {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="popup">
    <h2>Hey panda 🐼, take a break! 🦄</h2>
    <p>What would you like?</p>
    <button class="tea" onclick="showUnicorn('tea')">Tea 🍵</button>
    <button class="coffee" onclick="showUnicorn('coffee')">Coffee ☕</button>
  </div>

  <div id="unicorn" class="unicorn"></div>

  <script>
    function showUnicorn(choice) {
      let unicorn = document.getElementById("unicorn");
      unicorn.style.display = "block";
      
      if (choice === "tea") {
        unicorn.innerHTML = "🦄🍵"; // Unicorn with tea
      } else {
        unicorn.innerHTML = "🦄☕"; // Unicorn with coffee
      }
    }
  </script>
</body>
</html>
